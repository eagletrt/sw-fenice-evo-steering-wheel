name: PlatformIO Project CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - kraken

jobs:
  build:
    runs-on:
      group: ci-runners
      labels: Linux
    continue-on-error: ${{ !(github.ref == 'refs/heads/master' || github.ref == 'refs/heads/kraken') }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: generate-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORMIO_APP_ID }}
          private-key: ${{ secrets.PLATFORMIO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Git for Organization Cloning
        run: |
          git config --global --get-regexp 'url\..*\.insteadof' | cut -d' ' -f1 | xargs -I {} git config --global --unset-all {} || true
          git config --global url."https://x-access-token:${{ steps.generate-app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e release -e release-bootloader -e bootloader

      - name: Unit tests
        run: pio test -e tests

      - name: Static Code Analysis
        if: github.ref == 'refs/heads/kraken'
        run: pio check --src-filters="+<Core/Src/*>" --src-filters="+<Core/Inc/*>" --src-filters="-<Drivers/*>" || true
