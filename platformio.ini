[platformio]
src_dir = .
include_dir = .
default_envs = release

[env:release]
platform = ststm32
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200

board = genericSTM32H723ZG
board_build.ldscript = STM32H723XG_FLASH.ld

;   mode=Normal : hotplug connect (no NRST needed).
;   mode=UR     : connect under reset (needs NRST wired) - use this if a
;                 Normal connect fails or to recover a misbehaving target.
upload_protocol = custom
upload_command = STM32_Programmer_CLI -c port=SWD mode=Normal -d "$BUILD_DIR/firmware.elf" -v -rst

extra_scripts =
    pre:scripts/build_script.py
    pre:tools/generate_fonts.py

build_src_filter =
    +<Core/Src/>
    +<Drivers/STM32H7xx_HAL_Driver/Src>
    -<Drivers/STM32H7xx_HAL_Driver/Src/*_template.c>
    +<startup_stm32h723xx.s>
    +<tools/generated/*.c>
build_flags =
    -std=gnu23
    -DUSE_HAL_DRIVER
    -DSTM32H723xx
    -D_XOPEN_SOURCE
    -ICore/Inc
    -ICore/Inc/steering
    -ICore/Inc/steering/drivers
    -isystem Drivers/STM32H7xx_HAL_Driver/Inc
    -isystem Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
    -isystem Drivers/CMSIS/Device/ST/STM32H7xx/Include
    -isystem Drivers/CMSIS/Include
    -Itools/generated

lib_deps =
    https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0
    https://github.com/eagletrt/libpal-sw.git#v0.1.0
    https://github.com/eagletrt/libraster-sw.git#v2.1.0
    https://github.com/eagletrt/libcan-sw.git
    https://github.com/eagletrt/libtimebase-sw.git#dev

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
    clangtidy: --extra-arg=-std=gnu23
    clangtidy: --extra-arg=-U__cplusplus
check_src_filters =
    -<**>
    +<Core/Src/steering>
    +<Core/Inc/steering>


; Same firmware, linked after the OpenBLT bootloader (first 128K flash sector).
; Produces firmware.srec (with the OpenBLT checksum) for flashing over CAN.
[env:release-bootloader]
extends = env:release
board_build.ldscript = STM32H723XG_FLASH_SHIFTED.ld
board_upload.maximum_size = 917504
extra_scripts =
    pre:scripts/build_script.py
    pre:tools/generate_fonts.py
    post:scripts/openblt_image.py
upload_command = STM32_Programmer_CLI -c port=SWD mode=Normal -d "$BUILD_DIR/firmware.bin" 0x08020000 -v -rst

[env:tests]
platform = native
test_framework = unity
test_build_src = true

extra_scripts =
    pre:tools/generate_fonts.py

lib_deps =
    https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0
    https://github.com/eagletrt/libpal-sw.git#v0.1.0
    https://github.com/eagletrt/libraster-sw.git#v2.1.0
    https://github.com/eagletrt/libcan-sw.git
    https://github.com/eagletrt/libtimebase-sw.git#dev

build_flags =
    -std=gnu23
    -D_XOPEN_SOURCE
    -DEAGLETRT_STATIC=
    -ICore/Inc/steering
    -ICore/Inc/steering/drivers
    -Itools/generated
    -Itest/include
    -lm

build_src_filter =
    +<Core/Src/steering>
    +<tools/generated/*.c>

; PC simulator: the real Core/Src/steering code with host hooks (Tigr window,
; keyboard inputs, CAN printed/injected). Build and run: pio run -e simulator -t exec
[env:simulator]
platform = native

extra_scripts =
    pre:tools/generate_fonts.py
    pre:simulator/link_flags.py

lib_deps =
    https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0
    https://github.com/eagletrt/libpal-sw.git#v0.1.0
    https://github.com/eagletrt/libraster-sw.git#v2.1.0
    https://github.com/eagletrt/libcan-sw.git
    https://github.com/eagletrt/libtimebase-sw.git#dev

build_flags =
    -std=gnu23
    -D_XOPEN_SOURCE
    -ICore/Inc/steering
    -ICore/Inc/steering/drivers
    -Itools/generated
    -Isimulator/include
    -lm

build_src_filter =
    +<Core/Src/steering>
    +<tools/generated/*.c>
    +<simulator/src/*.c>

[env:bootloader]
platform = ststm32
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200

board = genericSTM32H723ZG
board_build.ldscript = fenice-evo-steering-wheel-bootloader-sw/STM32H723ZGTx_FLASH.ld
board_upload.maximum_size = 131072

upload_protocol = custom
upload_command = STM32_Programmer_CLI -c port=SWD mode=Normal -d "$BUILD_DIR/firmware.elf" -v -rst

build_src_filter =
    +<fenice-evo-steering-wheel-bootloader-sw/Core/Src/>
    +<fenice-evo-steering-wheel-bootloader-sw/Drivers/STM32H7xx_HAL_Driver/Src/>
    -<fenice-evo-steering-wheel-bootloader-sw/Drivers/STM32H7xx_HAL_Driver/Src/*_template.c>
    +<fenice-evo-steering-wheel-bootloader-sw/*.s>

build_flags =
    -std=gnu23
    -DUSE_HAL_DRIVER
    -DSTM32H723xx
    -DEXTERNAL_FLASH_ENABLED=0
    -Ifenice-evo-steering-wheel-bootloader-sw/Core/Inc
    -Ifenice-evo-steering-wheel-bootloader-sw/Core/Src
    -Ifenice-evo-steering-wheel-bootloader-sw/Drivers/CMSIS/Include
    -Ifenice-evo-steering-wheel-bootloader-sw/Drivers/STM32H7xx_HAL_Driver/Inc
    -Ifenice-evo-steering-wheel-bootloader-sw/Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
    -Ifenice-evo-steering-wheel-bootloader-sw/Drivers/CMSIS/Device/ST/STM32H7xx/Include

lib_deps = https://github.com/eagletrt/libcan-sw.git
