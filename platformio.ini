[platformio]
src_dir = .
include_dir = .

[env:stm32h723]
platform = ststm32
board = nucleo_h723zg
upload_protocol = stlink
platform_packages = 
  toolchain-gccarmnoneeabi@=1.140201.0
debug_tool = stlink
monitor_speed = 115200
board_build.ldscript = STM32H723ZGTx_FLASH_shifted.ld

build_src_filter = 
	+<**/*.c>
	+<*.s>
	-<Core/UI/Lib/McuFont/fonts/**>
	-<**/*.cpp>
	-<**/*_utils.c>
	-<Core/Simulator/**>
	-<Core/Lib/micro-libs/**>
	-<Core/Lib/sw-libgraphics/**>
	-<Core/Lib/invlib/inverter.c>
	-<Core/Lib/invlib/can/**>
	-<open-blt-fenice-steering-wheel/**>
	-<assets/**>

build_flags = 
    -std=gnu23
	-ICore/Inc
	-IDrivers/CMSIS/Include
	-IDrivers/STM32H7xx_HAL_Driver/Inc
	-IDrivers/CMSIS/Device/ST/STM32H7xx/Include
	-ICore/UI/Inc
	-ICore/Lib/can/lib/inverters
	-ICore/Lib/can/lib/primary
	-ICore/Lib/can/lib/secondary
	-ICore/Lib/invlib
	-ICore/UI/Lib/McuFont/decoder
	-ICore/UI/Lib/McuFont/fonts
	-DUSE_FULL_LL_DRIVER

lib_deps =
    https://github.com/eagletrt/libpal-sw.git
    https://github.com/eagletrt/libcan-sw.git

